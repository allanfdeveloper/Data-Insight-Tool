kind = "web"
previewPath = "/smc-trading/"
title = "SMC Trading Assistant"
version = "1.0.0"
id = "artifacts/smc-trading"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/smc-trading/" ]
localPort = 19024

[services.development]
run = "pnpm --filter @workspace/smc-trading run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smc-trading", "run", "build" ]
publicDir = "artifacts/smc-trading/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19024"
BASE_PATH = "/smc-trading/"

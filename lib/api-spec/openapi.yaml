openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SME Alternative Data Assessment API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: assessments
    description: File upload and assessment operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List all assessments for the current user
      responses:
        "200":
          description: List of assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/upload:
    post:
      operationId: uploadAssessment
      tags: [assessments]
      summary: Upload an Excel or CSV file for assessment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Assessment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Get a single assessment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment details with scorecard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/summary:
    get:
      operationId: getAssessmentSummary
      tags: [assessments]
      summary: Get dashboard summary stats for current user
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Admin - list all users with their assessments
      responses:
        "200":
          description: All users with assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Admin - get platform-wide statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    AuthCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        message:
          type: string
      required:
        - user
        - message

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - isAdmin
        - createdAt

    # ---------------------------------------------------------------
    # Scorecard — the multi-factor decision breakdown
    # ---------------------------------------------------------------
    ScorecardFactor:
      type: object
      properties:
        score:
          type: number
          description: Points earned for this factor
        maxScore:
          type: number
          description: Maximum possible points for this factor
        label:
          type: string
          description: Human-readable classification label
      required:
        - score
        - maxScore
        - label

    CashflowStrengthFactor:
      allOf:
        - $ref: "#/components/schemas/ScorecardFactor"
        - type: object
          properties:
            netRatio:
              type: number
              description: (totalInflow - totalOutflow) / totalInflow
            netCashflow:
              type: number
          required:
            - netRatio
            - netCashflow

    ActivityLevelFactor:
      allOf:
        - $ref: "#/components/schemas/ScorecardFactor"
        - type: object
          properties:
            transactionCount:
              type: integer
          required:
            - transactionCount

    ConsistencyFactor:
      allOf:
        - $ref: "#/components/schemas/ScorecardFactor"
        - type: object
          properties:
            cv:
              type: number
              nullable: true
              description: Coefficient of variation of monthly inflows (null if < 2 months data)
            monthCount:
              type: integer
              description: Number of calendar months with inflow transactions
          required:
            - monthCount

    Scorecard:
      type: object
      description: Multi-factor credit assessment scorecard
      properties:
        cashflowStrength:
          $ref: "#/components/schemas/CashflowStrengthFactor"
        activityLevel:
          $ref: "#/components/schemas/ActivityLevelFactor"
        consistency:
          $ref: "#/components/schemas/ConsistencyFactor"
        totalScore:
          type: number
          description: Weighted total score (0–100)
        maxScore:
          type: number
          description: Maximum possible total score (always 100)
        statusReason:
          type: string
          description: Plain-English explanation of the final decision
      required:
        - cashflowStrength
        - activityLevel
        - consistency
        - totalScore
        - maxScore
        - statusReason

    Assessment:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        fileName:
          type: string
        totalInflow:
          type: number
        totalOutflow:
          type: number
        transactionCount:
          type: integer
        status:
          type: string
          enum: [PASS, REVIEW, FAIL]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - fileName
        - totalInflow
        - totalOutflow
        - transactionCount
        - status
        - createdAt

    # AssessmentDetail = Assessment + scorecard (returned by upload + GET /id)
    AssessmentDetail:
      allOf:
        - $ref: "#/components/schemas/Assessment"
        - type: object
          properties:
            scorecard:
              $ref: "#/components/schemas/Scorecard"

    AssessmentSummary:
      type: object
      properties:
        totalAssessments:
          type: integer
        latestAssessment:
          $ref: "#/components/schemas/Assessment"
        passCount:
          type: integer
        reviewCount:
          type: integer
        failCount:
          type: integer
      required:
        - totalAssessments
        - passCount
        - reviewCount
        - failCount

    AdminUserRecord:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        assessmentCount:
          type: integer
        latestAssessment:
          $ref: "#/components/schemas/Assessment"
      required:
        - id
        - email
        - isAdmin
        - createdAt
        - assessmentCount

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalAssessments:
          type: integer
        passCount:
          type: integer
        reviewCount:
          type: integer
        failCount:
          type: integer
      required:
        - totalUsers
        - totalAssessments
        - passCount
        - reviewCount
        - failCount

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SME Alternative Data Assessment API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: assessments
    description: File upload and assessment operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List all assessments for the current user
      responses:
        "200":
          description: List of assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/upload:
    post:
      operationId: uploadAssessment
      tags: [assessments]
      summary: Upload an Excel or CSV file for assessment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Assessment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Get a single assessment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment details with scorecard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments/summary:
    get:
      operationId: getAssessmentSummary
      tags: [assessments]
      summary: Get dashboard summary stats for current user
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Admin - list all users with their assessments
      responses:
        "200":
          description: All users with assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Admin - get platform-wide statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin]
      summary: Admin - get current assessment configuration
      responses:
        "200":
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentConfig"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdateSettings
      tags: [admin]
      summary: Admin - update assessment configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentConfigInput"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentConfig"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    AuthCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        message:
          type: string
      required:
        - user
        - message

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - isAdmin
        - createdAt

    # ---------------------------------------------------------------
    # Admin configuration for the assessment engine
    # ---------------------------------------------------------------
    AssessmentConfig:
      type: object
      description: Configurable parameters for the assessment scoring engine
      properties:
        id:
          type: integer
        minMonths:
          type: integer
          description: Minimum months of data required to allow a PASS verdict
        minTransactions:
          type: integer
          description: Minimum transaction count required to allow a PASS verdict
        passThreshold:
          type: integer
          description: Minimum score (0-100) for a PASS verdict
        reviewThreshold:
          type: integer
          description: Minimum score (0-100) for a REVIEW verdict (below this = FAIL)
        cashflowWeight:
          type: number
          description: Weight (%) applied to the cashflow strength factor
        activityWeight:
          type: number
          description: Weight (%) applied to the activity level factor
        consistencyWeight:
          type: number
          description: Weight (%) applied to the income consistency factor
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - minMonths
        - minTransactions
        - passThreshold
        - reviewThreshold
        - cashflowWeight
        - activityWeight
        - consistencyWeight
        - updatedAt

    AssessmentConfigInput:
      type: object
      description: Input for updating assessment configuration
      properties:
        minMonths:
          type: integer
          minimum: 1
          maximum: 24
        minTransactions:
          type: integer
          minimum: 1
          maximum: 500
        passThreshold:
          type: integer
          minimum: 1
          maximum: 100
        reviewThreshold:
          type: integer
          minimum: 0
          maximum: 99
        cashflowWeight:
          type: number
          minimum: 0
          maximum: 100
        activityWeight:
          type: number
          minimum: 0
          maximum: 100
        consistencyWeight:
          type: number
          minimum: 0
          maximum: 100
      required:
        - minMonths
        - minTransactions
        - passThreshold
        - reviewThreshold
        - cashflowWeight
        - activityWeight
        - consistencyWeight

    # ---------------------------------------------------------------
    # Scorecard — the multi-factor decision breakdown
    # ---------------------------------------------------------------
    AssessmentConfidence:
      type: string
      enum: [HIGH, MEDIUM, LOW]
      description: >
        Confidence level of the assessment based on data sufficiency.
        HIGH = meets both minimum months and transaction requirements.
        MEDIUM = meets only one requirement.
        LOW = meets neither requirement.

    TriggeredRule:
      type: object
      description: A rule that affected the final assessment decision
      properties:
        rule:
          type: string
          description: Machine-readable rule identifier
        effect:
          type: string
          enum: [auto-fail, cap-review, score-penalty, score-bonus, passed, confidence-warning]
          description: How this rule affected the verdict
        description:
          type: string
          description: Human-readable explanation of this rule
      required:
        - rule
        - effect
        - description

    ScorecardFactor:
      type: object
      properties:
        score:
          type: number
          description: Weighted points earned for this factor (contributes to 0-100 total)
        maxScore:
          type: number
          description: Maximum possible weighted points for this factor
        label:
          type: string
          description: Human-readable classification label
        normalizedScore:
          type: number
          description: Raw 0-100 score for this factor before weight is applied
        weight:
          type: number
          description: Weight percentage applied to this factor
      required:
        - score
        - maxScore
        - label
        - normalizedScore
        - weight

    CashflowStrengthFactor:
      allOf:
        - $ref: "#/components/schemas/ScorecardFactor"
        - type: object
          properties:
            netRatio:
              type: number
              description: (totalInflow - totalOutflow) / totalInflow
            netCashflow:
              type: number
          required:
            - netRatio
            - netCashflow

    ActivityLevelFactor:
      allOf:
        - $ref: "#/components/schemas/ScorecardFactor"
        - type: object
          properties:
            transactionCount:
              type: integer
          required:
            - transactionCount

    ConsistencyFactor:
      allOf:
        - $ref: "#/components/schemas/ScorecardFactor"
        - type: object
          properties:
            cv:
              type: number
              nullable: true
              description: Coefficient of variation of monthly inflows (null if < 2 months data)
            monthCount:
              type: integer
              description: Number of calendar months with inflow transactions
            irregularityScore:
              type: number
              description: Penalty points subtracted due to irregular patterns
            irregularityFlags:
              type: array
              items:
                type: string
              description: List of detected irregularity issues
          required:
            - monthCount
            - irregularityScore
            - irregularityFlags

    ConcentrationRisk:
      type: string
      enum: [LOW, MODERATE, HIGH]
      description: >
        Revenue concentration risk classification based on inflow distribution.
        LOW = largest inflow < 25% and top 3 < 60% of total inflows.
        MODERATE = largest inflow 25–40% or top 3 60–80% of total inflows.
        HIGH = largest inflow > 40% or top 3 > 80% of total inflows.

    RevenueConcentration:
      type: object
      description: Revenue concentration risk analysis based on inflow transaction distribution
      properties:
        inflowCount:
          type: integer
          description: Total number of inflow transactions analysed
        largestInflow:
          type: number
          description: Amount of the single largest inflow transaction
        largestInflowPct:
          type: number
          description: Largest inflow as a percentage of total inflows
        top3Inflow:
          type: number
          description: Combined amount of the top 3 largest inflow transactions
        top3Pct:
          type: number
          description: Top 3 inflows as a percentage of total inflows
        risk:
          $ref: "#/components/schemas/ConcentrationRisk"
        scoreModifier:
          type: number
          description: Score adjustment applied (0, −2, or −4)
        observations:
          type: array
          items:
            type: string
          description: Human-readable explanations of the concentration finding
      required:
        - inflowCount
        - largestInflow
        - largestInflowPct
        - top3Inflow
        - top3Pct
        - risk
        - scoreModifier
        - observations

    MarginClassification:
      type: string
      enum: [Strong, Moderate, Thin]
      description: >
        Operational margin strength classification based on net cashflow as a
        percentage of total inflows.
        Strong = above 30%.
        Moderate = 15%–30%.
        Thin = below 15%.

    MarginHealth:
      type: object
      description: Financial resilience intelligence based on operational margin analysis
      properties:
        marginRatio:
          type: number
          description: Net cashflow as a percentage of total inflows (0–100 scale)
        classification:
          $ref: "#/components/schemas/MarginClassification"
        scoreModifier:
          type: number
          description: Net score adjustment applied from margin, deterioration, and recovery signals
        observations:
          type: array
          items:
            type: string
          description: Human-readable insights about operational margin quality and resilience
        isSevereDeterioration:
          type: boolean
          description: True when both inflows and net cashflow are declining sharply
        isRecovery:
          type: boolean
          description: True when consistent recovery momentum is confirmed across both inflows and net
      required:
        - marginRatio
        - classification
        - scoreModifier
        - observations
        - isSevereDeterioration
        - isRecovery

    MonthlyDataPoint:
      type: object
      description: Aggregated cashflow data for a single calendar month
      properties:
        month:
          type: string
          description: Calendar month in YYYY-MM format
        inflow:
          type: number
          description: Total inflows recorded in this month
        outflow:
          type: number
          description: Total outflows recorded in this month
        net:
          type: number
          description: Net cashflow for this month (inflow - outflow)
      required:
        - month
        - inflow
        - outflow
        - net

    TrendClassification:
      type: string
      enum: [POSITIVE, STABLE, NEGATIVE]
      description: >
        Overall directional trend classification based on cashflow trajectory.
        POSITIVE = cashflow is improving over the assessment period.
        STABLE = no significant directional movement detected.
        NEGATIVE = cashflow is deteriorating over the assessment period.

    TrendAnalysis:
      type: object
      description: Monthly trend intelligence computed from transaction history
      properties:
        monthlyData:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyDataPoint"
          description: Per-month aggregated inflow, outflow, and net cashflow
        classification:
          $ref: "#/components/schemas/TrendClassification"
        inflowTrend:
          type: string
          enum: [increasing, stable, declining]
          description: Directional movement of monthly total inflows
        outflowTrend:
          type: string
          enum: [increasing, stable, declining]
          description: Directional movement of monthly total outflows
        netTrend:
          type: string
          enum: [improving, stable, deteriorating]
          description: Directional movement of monthly net cashflow
        volatility:
          type: string
          enum: [low, moderate, high]
          description: Month-to-month fluctuation level in net cashflow
        trendScore:
          type: number
          description: Score modifier applied to the total score (negative to positive)
        explanations:
          type: array
          items:
            type: string
          description: Human-readable insights describing the detected trend patterns
        isSevereDeterioration:
          type: boolean
          description: True when both inflows and net cashflow are declining sharply (slope exceeds severe threshold)
        hasRecoveryMomentum:
          type: boolean
          description: True when both inflows and net cashflow show consistent upward improvement
      required:
        - monthlyData
        - classification
        - inflowTrend
        - outflowTrend
        - netTrend
        - volatility
        - trendScore
        - explanations
        - isSevereDeterioration
        - hasRecoveryMomentum

    Scorecard:
      type: object
      description: Multi-factor credit assessment scorecard
      properties:
        cashflowStrength:
          $ref: "#/components/schemas/CashflowStrengthFactor"
        activityLevel:
          $ref: "#/components/schemas/ActivityLevelFactor"
        consistency:
          $ref: "#/components/schemas/ConsistencyFactor"
        totalScore:
          type: number
          description: Weighted total score (0–100)
        maxScore:
          type: number
          description: Maximum possible total score (always 100)
        statusReason:
          type: string
          description: Plain-English explanation of the final decision
        confidence:
          $ref: "#/components/schemas/AssessmentConfidence"
        confidenceReasons:
          type: array
          items:
            type: string
          description: Explanations for why confidence is reduced (empty when HIGH)
        triggeredRules:
          type: array
          items:
            $ref: "#/components/schemas/TriggeredRule"
          description: Rules that affected the final verdict
        trendAnalysis:
          $ref: "#/components/schemas/TrendAnalysis"
        marginHealth:
          $ref: "#/components/schemas/MarginHealth"
        revenueConcentration:
          $ref: "#/components/schemas/RevenueConcentration"
        configSnapshot:
          type: object
          description: Configuration values used when this assessment was scored
          properties:
            passThreshold:
              type: integer
            reviewThreshold:
              type: integer
            minMonths:
              type: integer
            minTransactions:
              type: integer
            cashflowWeight:
              type: number
            activityWeight:
              type: number
            consistencyWeight:
              type: number
          required:
            - passThreshold
            - reviewThreshold
            - minMonths
            - minTransactions
            - cashflowWeight
            - activityWeight
            - consistencyWeight
      required:
        - cashflowStrength
        - activityLevel
        - consistency
        - totalScore
        - maxScore
        - statusReason
        - confidence
        - confidenceReasons
        - trendAnalysis
        - marginHealth
        - revenueConcentration
        - triggeredRules
        - configSnapshot

    Assessment:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        fileName:
          type: string
        totalInflow:
          type: number
        totalOutflow:
          type: number
        transactionCount:
          type: integer
        status:
          type: string
          enum: [PASS, REVIEW, FAIL]
        confidence:
          $ref: "#/components/schemas/AssessmentConfidence"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - fileName
        - totalInflow
        - totalOutflow
        - transactionCount
        - status
        - confidence
        - createdAt

    # AssessmentDetail = Assessment + scorecard (returned by upload + GET /id)
    AssessmentDetail:
      allOf:
        - $ref: "#/components/schemas/Assessment"
        - type: object
          properties:
            scorecard:
              $ref: "#/components/schemas/Scorecard"

    AssessmentSummary:
      type: object
      properties:
        totalAssessments:
          type: integer
        latestAssessment:
          $ref: "#/components/schemas/Assessment"
        passCount:
          type: integer
        reviewCount:
          type: integer
        failCount:
          type: integer
      required:
        - totalAssessments
        - passCount
        - reviewCount
        - failCount

    AdminUserRecord:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        assessmentCount:
          type: integer
        latestAssessment:
          $ref: "#/components/schemas/Assessment"
      required:
        - id
        - email
        - isAdmin
        - createdAt
        - assessmentCount

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalAssessments:
          type: integer
        passCount:
          type: integer
        reviewCount:
          type: integer
        failCount:
          type: integer
        highConfidenceCount:
          type: integer
        mediumConfidenceCount:
          type: integer
        lowConfidenceCount:
          type: integer
      required:
        - totalUsers
        - totalAssessments
        - passCount
        - reviewCount
        - failCount
        - highConfidenceCount
        - mediumConfidenceCount
        - lowConfidenceCount
